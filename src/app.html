<!doctype html>

<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />

		<meta
			name="viewport"
			content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />

		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<script>
			(() => {
				const showBootstrapError = () => {
					if (document.documentElement.dataset.tappenBootstrapped === 'true') return;
					if (document.visibilityState !== 'visible') return;
					document.getElementById('tappen-bootstrap-error')?.removeAttribute('hidden');
				};
				window.setTimeout(showBootstrapError, 30_000);
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<div
			id="tappen-bootstrap-error"
			hidden
			style="
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: grid;
				place-items: center;
				padding: 2rem;
				background: #f3f4f6;
				color: #111827;
				font:
					16px/1.5 system-ui,
					sans-serif;
				text-align: center;
			">
			<div style="max-width: 28rem">
				<h1 style="font-size: 1.25rem; margin: 0 0 0.75rem">Det tar längre tid än vanligt</h1>
				<p style="margin: 0 0 1.25rem">
					Försök att ladda om appen om den inte startar.<br />Try reloading the app if it does not
					start.
				</p>
				<button
					type="button"
					onclick="location.reload()"
					style="
						border: 0;
						border-radius: 0.5rem;
						padding: 0.75rem 1rem;
						background: #111827;
						color: white;
						font: inherit;
						font-weight: 600;
					">
					Försök igen / Try again
				</button>
			</div>
		</div>
	</body>
</html>
