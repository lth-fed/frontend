name: fed-production

volumes:
  postgres-storage:
  rustfs-storage:

services:
  # TODO: eventually replace with host-hosted Postgres, it's suboptimal to have it in a container.
  fed-postgres:
    restart: unless-stopped
    image: 'postgres:18'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fed
    volumes:
      - postgres-storage:/var/lib/postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12

  # fed-collector:
  # image: "otel/opentelemetry-collector:0.154.0"
  # command: "--config=/etc/otel-collector.yaml"
  # volumes:
  #   - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
  # restart: unless-stopped

  fed-auth:
    image: esekmacapar/fed-auth:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - '8001:8001'
    environment:
      DEBUG: 1
      PRIVATE_KEY: MC4CAQAwBQYDK2VwBCIEIFK6AFAC88i7Db6SycvPJk68l+H+GVcj1MRso/aq2Uw4
      DATABASE_URL: postgres://postgres:postgres@fed-postgres:5432/auth
      SAML_PRIVATE_KEY: 
      SAML_CERTIFICATE: 

    depends_on:
      fed-postgres:
        condition: service_healthy

  transactions:
    image: esekmacapar/transactions:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - '8002:8002'
    environment:
      DEBUG: 1
      DATABASE_URL: postgres://postgres:postgres@fed-postgres:5432/transactions
      PRIVATE_KEY: MC4CAQAwBQYDK2VwBCIEIHY7RY00swTFcP0EjsP+vdFLlELLnN4EsStBYBKGnQZF
    depends_on:
      fed-postgres:
        condition: service_healthy

  transactions-seed:
    image: postgres:18
    restart: 'no'
    volumes:
      - ./auth-seed.sql:/auth.sql:ro
    environment:
      DEBUG: 1
      PGPASSWORD: postgres
    depends_on:
      fed-postgres:
        condition: service_healthy
      transactions:
        condition: service_started
    entrypoint: ['sh', '-ec']
    command:
      - >-
        until psql -h fed-postgres -U postgres -d transactions -c 'select 1 from client_ids limit 1'
        >/dev/null 2>&1; do sleep 2; done; if ! psql -h fed-postgres -U postgres -d transactions
        -Atqc "select 1 from client_ids where client_id = 'esek'" | grep -q 1; then psql -h
        fed-postgres -U postgres -d transactions -f /auth.sql; fi

  minilith:
    image: esekmacapar/minilith:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      DEBUG: 1
      DATABASE_URL: 'postgres://postgres:postgres@fed-postgres:5432/fed'
      ENCRYPTION_KEY: 'EJuu3Odzba5dSzL/huWKwM9ifVjfpsSmy32vxltpQKU='
      TRANSACTIONS_TOKEN: 'hehe-super-secure'

      S3_ACCESS_KEY: 'rustfs'
      S3_SECRET_KEY: 'rustfs'
      S3_PUBLIC_URL: 'http://localhost:9000/image'
    depends_on:
      fed-postgres:
        condition: service_healthy
      fed-s3:
        condition: service_started
      transactions:
        condition: service_started

  minilith-seed:
    image: esekmacapar/minilith:latest
    platform: linux/amd64
    restart: 'no'
    environment:
      DEBUG: 1
      DATABASE_URL: 'postgres://postgres:postgres@fed-postgres:5432/fed'
      ENCRYPTION_KEY: 'EJuu3Odzba5dSzL/huWKwM9ifVjfpsSmy32vxltpQKU='
      TRANSACTIONS_TOKEN: 'hehe-super-secure'
      S3_ACCESS_KEY: 'rustfs'
      S3_SECRET_KEY: 'rustfs'
      S3_PUBLIC_URL: 'http://localhost:9000/image'
    depends_on:
      fed-postgres:
        condition: service_healthy
      fed-s3:
        condition: service_started
      minilith:
        condition: service_started
    entrypoint: ['sh', '-ec']
    command:
      - >-
        until /app/seed-dev --override-production; do sleep 2; done

  fed-s3:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: rustfs
      RUSTFS_SECRET_KEY: rustfs
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs-storage:/data
