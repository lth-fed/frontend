name: fed-frontend

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

services:
  fed-frontend:
    build:
      context: .
      target: fed-frontend
    image: ${CONTAINER_REGISTRY:-localhost}/fed-frontend:${CONTAINER_TAG:-production}
    restart: unless-stopped
    expose:
      - '80'
    ports:
      - '8100:80'
    networks:
      - traefik
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.fed-frontend.rule: Host(`${FRONTEND_DOMAIN:-teknologappen.se}`)
      traefik.http.routers.fed-frontend.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.fed-frontend.tls: 'true'
      traefik.http.routers.fed-frontend.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.services.fed-frontend.loadbalancer.server.port: '80'

  fed-auth-frontend:
    build:
      context: .
      target: fed-auth-frontend
    image: ${CONTAINER_REGISTRY:-localhost}/fed-auth-frontend:${CONTAINER_TAG:-production}
    restart: unless-stopped
    expose:
      - '80'
    ports:
      - '8101:80'
    networks:
      - traefik
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.fed-auth-frontend.rule: Host(`${AUTH_DOMAIN:-auth.teknologappen.se}`)
      traefik.http.routers.fed-auth-frontend.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.fed-auth-frontend.tls: 'true'
      traefik.http.routers.fed-auth-frontend.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.services.fed-auth-frontend.loadbalancer.server.port: '80'
