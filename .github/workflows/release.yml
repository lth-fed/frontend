name: Release Mobile Apps

# Builds and, when actually shipping, uploads the iOS and Android apps.
# release-please (.github/workflows/release-please.yml) auto-creates each
# release directly as a GitHub *prerelease* (real tag, created immediately —
# not a draft) with the full Conventional Commits changelog as its body.
# That creation fires `published`, which runs this workflow in build+sign
# ONLY mode — no store upload — so every proposed release gets a free,
# automatic "does it still build" check with no risk of shipping anything.
#
# Shipping is a separate, deliberate action: open the prerelease on the
# repo's Releases page, edit it to uncheck "Set as a pre-release", and save.
# That promotion fires GitHub's `released` event, which is the ONLY trigger
# this workflow ever uploads on (see SKIP_UPLOAD below) — regardless of the
# release's prerelease flag, so a directly-created stable release (skipping
# the prerelease step entirely, e.g. for a hotfix) can't double-upload from
# both `published` and `released` firing for the same release.
#
# The release's tag name is the marketing version shipped to both stores
# verbatim (e.g. tag "v1.4.0" or "1.4.0" -> version "1.4.0"). Build
# *numbers* (the invisible per-upload counter, not the marketing version)
# are fetched live from App Store Connect / Play Console and incremented,
# so the versions committed in the Xcode project / build.gradle are only
# relevant for local development builds.
#
# The release's full description is a changelog, not App Store copy — it
# includes every Conventional Commit type (chore, ci, refactor, ...), which
# must never reach end users. Before promoting a release, add a
# "### App Store Notes" section to its body with a short, human-written
# summary — that's the ONLY text ever sent to the stores. If it's missing
# at promotion time, the `version` job fails on purpose rather than
# shipping the technical changelog instead; add the section and re-run.
#
# See docs/release-process.md for the full flow and one-time setup
# (required secrets).

on:
  release:
    types: [published, released]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive release version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch and require App Store release notes
        # Only needed (and only enforced) on the actual ship trigger — the
        # dry-run build on `published` doesn't upload anything, so it
        # doesn't need release notes at all. Fetched live via `gh` rather
        # than read from the event payload so that fixing the release body
        # and using "Re-run failed jobs" picks up the fix (the event
        # payload itself is frozen at the time the workflow first fired).
        if: github.event.action == 'released'
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          BODY="$(gh release view "$TAG" --json body -q .body)"
          CURATED="$(printf '%s' "$BODY" | .github/scripts/curate-release-notes.sh)"
          if [ -z "$CURATED" ]; then
            MSG="No '### App Store Notes' section found in the $TAG release body."
            MSG="$MSG Add one (a short, human-written summary — the ONLY text that ships to the"
            MSG="$MSG App Store and Play Store), then re-run this job."
            echo "::error::$MSG"
            exit 1
          fi
          {
            echo "release_notes<<RELEASE_NOTES_EOF"
            echo "$CURATED"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  ios:
    needs: version
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Pinned to match the Xcode version this project is actually developed
      # against — the native Swift plugins use iOS 26 "Liquid Glass" UIKit
      # APIs that don't exist in older SDKs, so an older/default Xcode fails
      # to compile them outright. Bump this deliberately (and in lockstep
      # with local dev Xcode) rather than trusting the runner's default,
      # which GitHub moves over time.
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Decode signing assets
        run: |
          CERT_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios_profile.mobileprovision"
          ASC_KEY_PATH="$RUNNER_TEMP/asc_api_key.p8"

          echo "${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}" | base64 --decode -o "$CERT_PATH"
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode -o "$PROFILE_PATH"
          echo "${{ secrets.ASC_API_KEY_BASE64 }}" | base64 --decode -o "$ASC_KEY_PATH"

          echo "IOS_CERTIFICATE_PATH=$CERT_PATH" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name:
          "${{ github.event.action == 'released' && 'Build, sign, and release to the App Store' ||
          'Build and sign (dry run, upload skipped)' }}"
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_NOTES: ${{ needs.version.outputs.release_notes }}
          SKIP_UPLOAD: ${{ github.event.action != 'released' }}
          ASC_LOCALE: ${{ vars.ASC_LOCALE || 'sv' }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: bundle exec fastlane ios release

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app-${{ needs.version.outputs.version }}
          path: build/ios/App.ipa
          retention-days: 14

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # @capacitor/android and capacitor-cordova-android-plugins both
          # declare sourceCompatibility/targetCompatibility VERSION_21 —
          # javac rejects `--release 21` on anything older.
          java-version: '21'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Decode signing assets
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          PLAY_KEY_PATH="$RUNNER_TEMP/play-store-key.json"

          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          echo "${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}" | base64 -d > "$PLAY_KEY_PATH"

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "PLAY_STORE_JSON_KEY_PATH=$PLAY_KEY_PATH" >> "$GITHUB_ENV"

      - name:
          "${{ github.event.action == 'released' && 'Build, sign, and release to Google Play' ||
          'Build and sign (dry run, upload skipped)' }}"
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_NOTES: ${{ needs.version.outputs.release_notes }}
          SKIP_UPLOAD: ${{ github.event.action != 'released' }}
          PLAY_LOCALE: ${{ vars.PLAY_LOCALE || 'sv-SE' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane android release

      - uses: actions/upload-artifact@v4
        with:
          name: android-app-${{ needs.version.outputs.version }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
