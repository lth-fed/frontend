name: Release Mobile Apps

# Builds and ships the iOS and Android apps whenever a GitHub Release is
# published. release-please (.github/workflows/release-please.yml) opens
# the release as a *draft* with the full Conventional Commits changelog as
# its body — nothing here runs until a human reviews that draft and clicks
# "Publish release", which is what actually fires this workflow. The
# release's tag name is the marketing version shipped to both stores
# verbatim (e.g. tag "v1.4.0" or "1.4.0" -> version "1.4.0"). Build
# *numbers* (the invisible per-upload counter, not the marketing version)
# are fetched live from App Store Connect / Play Console and incremented,
# so the versions committed in the Xcode project / build.gradle are only
# relevant for local development builds.
#
# The release's full description is a changelog, not App Store copy — it
# includes every Conventional Commit type (chore, ci, refactor, ...), which
# isn't what end users should see as "What's New". The `version` job below
# curates it down to just the Features/Bug Fixes bullets (plain text, no
# Markdown or commit links) before it's handed to fastlane.
#
# Mark the GitHub Release as a "pre-release" to still build and sign both
# apps — so you can verify the pipeline end-to-end — but skip the actual
# App Store / Play Store upload. The signed .ipa/.aab are attached as
# workflow run artifacts (Actions tab -> the run -> Artifacts) either way.
#
# See docs/release-process.md for the one-time setup (required secrets).

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive release version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Curate store release notes from full changelog
        id: notes
        env:
          FULL_BODY: ${{ github.event.release.body }}
        run: |
          CURATED="$(printf '%s' "$FULL_BODY" | .github/scripts/curate-release-notes.sh)"
          if [ -z "$CURATED" ]; then
            CURATED="General improvements and bug fixes."
          fi
          {
            echo "release_notes<<RELEASE_NOTES_EOF"
            echo "$CURATED"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  ios:
    needs: version
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Pinned to match the Xcode version this project is actually developed
      # against — the native Swift plugins use iOS 26 "Liquid Glass" UIKit
      # APIs that don't exist in older SDKs, so an older/default Xcode fails
      # to compile them outright. Bump this deliberately (and in lockstep
      # with local dev Xcode) rather than trusting the runner's default,
      # which GitHub moves over time.
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Decode signing assets
        run: |
          CERT_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios_profile.mobileprovision"
          ASC_KEY_PATH="$RUNNER_TEMP/asc_api_key.p8"

          echo "${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}" | base64 --decode -o "$CERT_PATH"
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode -o "$PROFILE_PATH"
          echo "${{ secrets.ASC_API_KEY_BASE64 }}" | base64 --decode -o "$ASC_KEY_PATH"

          echo "IOS_CERTIFICATE_PATH=$CERT_PATH" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name:
          "${{ github.event.release.prerelease && 'Build and sign (pre-release, upload skipped)' ||
          'Build, sign, and release to the App Store' }}"
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_NOTES: ${{ needs.version.outputs.release_notes }}
          SKIP_UPLOAD: ${{ github.event.release.prerelease }}
          ASC_LOCALE: ${{ vars.ASC_LOCALE || 'sv' }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: bundle exec fastlane ios release

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app-${{ needs.version.outputs.version }}
          path: build/ios/App.ipa
          retention-days: 14

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # @capacitor/android and capacitor-cordova-android-plugins both
          # declare sourceCompatibility/targetCompatibility VERSION_21 —
          # javac rejects `--release 21` on anything older.
          java-version: '21'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Decode signing assets
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          PLAY_KEY_PATH="$RUNNER_TEMP/play-store-key.json"

          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          echo "${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}" | base64 -d > "$PLAY_KEY_PATH"

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "PLAY_STORE_JSON_KEY_PATH=$PLAY_KEY_PATH" >> "$GITHUB_ENV"

      - name:
          "${{ github.event.release.prerelease && 'Build and sign (pre-release, upload skipped)' ||
          'Build, sign, and release to Google Play' }}"
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_NOTES: ${{ needs.version.outputs.release_notes }}
          SKIP_UPLOAD: ${{ github.event.release.prerelease }}
          PLAY_LOCALE: ${{ vars.PLAY_LOCALE || 'sv-SE' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane android release

      - uses: actions/upload-artifact@v4
        with:
          name: android-app-${{ needs.version.outputs.version }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
