name: CLA Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  cla-check:
    # cla-check is a required branch-protection status check, so this job must always RUN and
    # report success/failure — never be skipped via a job-level `if`. A skipped job reports no
    # status at all, which leaves a required check stuck at "Expected — waiting for status to be
    # reported" forever, permanently blocking the PR from becoming mergeable.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check CLA signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # release-please opens its own release PRs as github-actions[bot], bundling commits
          # that already went through this check (and signed the CLA) on their original PRs.
          # There's no new authorship to gate here — succeed immediately rather than asking a
          # bot to sign a human CLA.
          if [ "$AUTHOR" = "github-actions[bot]" ]; then
            echo "Skipping CLA check for github-actions[bot] (release-please PR)"
            exit 0
          fi

          echo "Checking CLA for $AUTHOR"

          SIGNATURES=$(gh api "repos/${{ github.repository }}/contents/.github/cla-signatures.json" \
            --jq '.content' | base64 -d)

          if echo "$SIGNATURES" | jq -e --arg user "$AUTHOR" 'index($user) != null' > /dev/null; then
            echo "CLA signed"
            exit 0
          fi

          echo "CLA NOT signed by $AUTHOR"

          ALREADY_COMMENTED=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("/sign-cla"))] | length')

          if [ "$ALREADY_COMMENTED" = "0" ]; then
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body \
              "@$AUTHOR, please read and sign the [Contributor License Agreement](https://github.com/lth-fed/docs/blob/main/agreements/CLA.md) before this PR can be merged.

          To sign, comment \`/sign-cla\` on this PR."
          fi

          exit 1
