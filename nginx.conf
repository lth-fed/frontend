server {
	listen 80;
	root /usr/share/nginx/html;

	location = /.well-known/apple-app-site-association {
		default_type application/json;
		try_files $uri =404;
	}

	location = /.well-known/assetlinks.json {
		types { }
		default_type application/json;
		try_files $uri =404;
	}

	location ^~ /.well-known/ {
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
